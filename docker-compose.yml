services:
  postgres:
    image: postgres:15
    container_name: um-postgres
    environment:
      POSTGRES_DB: usermanagement
      POSTGRES_USER: ${DB_USERNAME:-usermanagement}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-usermanagement}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates a separate "keycloak" database on first start
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d usermanagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: um-keycloak
    # Imports the realm, roles, and clients from ./docker/keycloak on first start
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${DB_USERNAME:-usermanagement}
      KC_DB_PASSWORD: ${DB_PASSWORD:-usermanagement}
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080" # Keycloak console: http://localhost:8081
    volumes:
      - ./docker/keycloak/realm-user-management.json:/opt/keycloak/data/import/realm-user-management.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
